{% extends "base.html" %}
{% block title %}{{ code }} - {{ title }}{% endblock %}
{% block content %}
<div class="max-w-xl mx-auto px-4 py-20 text-center">
  <p class="text-7xl font-extrabold text-indigo-600">{{ code }}</p>
  <h1 class="mt-4 text-2xl font-bold text-slate-900">{{ title }}</h1>
  <p class="mt-2 text-slate-500">{{ message }}</p>
  <div class="mt-8 flex justify-center gap-3"><a href="/" class="btn btn-primary">Go to Home</a><a href="/jobs" class="btn btn-outline">Browse Jobs</a></div>
</div>
{% endblock %}
